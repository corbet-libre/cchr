[package]
name = "cchr"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Charter: verified community trust material and monotonic revisions"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/cchr"
publish = false

[features]
door-vectors = []

[dependencies]
cgrd = { git = "https://git.corbet.ch/corbet-foss/cgrd", branch = "main", default-features = false }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false }
cshm = { git = "https://git.corbet.ch/corbet-foss/cshm", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
url = "2"

[dev-dependencies]
coset = "0.4"
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"
